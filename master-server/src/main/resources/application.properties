server.port=8080

spring.application.name=proxmox-telemetry-master

# H2 Database configuration (persists in local ./data directory)
spring.datasource.url=jdbc:h2:file:./data/master_telemetry_db;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console (for debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Polling configuration
master.polling.default-interval-seconds=5
